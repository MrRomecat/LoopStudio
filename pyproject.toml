[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "studio-suite"
# держать в согласии с shell/app.py APP_VERSION и packaging/installer.iss
version = "1.5.4"
description = "Studio Suite — LoopStudio: длинные музыкальные YouTube-видео"
requires-python = ">=3.12"
dependencies = [
    "PySide6>=6.7",
    "cryptography>=42",
    "httpx>=0.27",   # ИИ-провайдеры (core/ai): HTTP-клиент с таймаутами
    "keyring>=25",   # API-ключи пользователя в Диспетчере учётных данных Windows
    "Pillow>=10",    # PreviuStudio: наложение текста на превью, экспорт JPG
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-qt>=4.4",
    "mypy>=1.10",
    "ruff>=0.5",
    "numpy>=2",  # только для scripts/generate_assets.py (генерация ассетов)
]

[tool.setuptools.packages.find]
include = ["core*", "modules*", "shell*"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["bin", ".venv"]

[tool.ruff.format]
skip-magic-trailing-comma = true

[tool.ruff.lint.isort]
split-on-trailing-comma = false

[tool.ruff.lint]
select = [
    "E",   # pycodestyle
    "F",   # pyflakes
    "W",   # warnings
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # bugbear
    "SIM", # simplify
    "RUF", # ruff-specific
]
# RUF001-003 ругаются на кириллицу в строках/докстрингах — проект русскоязычный
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["core", "modules", "shell", "scripts", "tests"]
exclude = ["bin", ".venv"]

[[tool.mypy.overrides]]
# генератор ассетов — вспомогательный скрипт: единственное послабление —
# warn_return_any (numpy-выражения); остальной strict действует и здесь
module = "scripts.generate_assets"
warn_return_any = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
